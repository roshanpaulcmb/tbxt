# Restart launcher for the TBXT (AF3 g177d) REST2 run. Sources params from
# initTbxtAf3g177d.conf, auto-discovers the latest restart checkpoint under
# runs/$run_name/, sources its global .tcl (which sets i_job, i_run, i_step,
# restart_root), then extends num_runs and hands off to rest2_remd.namd.
#
# Use this same file for every restart attempt -- the driver auto-increments
# i_job internally, so output files become rest2.job1.*, rest2.job2.*, ...
# RUN_NAME env must match the initial submission.
# NUM_RUNS env sets the absolute run target (e.g. 100000 = 200 ns).
# If unset, extends by init's num_runs each restart.

source initTbxtAf3g177d.conf
set TEMP $min_temp

# The driver writes a global checkpoint .tcl at runs/$run_name/rest2.jobJ.restart<N>.tcl
# (the %s in output_root substitutes with "" for this one file -- see
# rest2_remd.namd:205). Pick the one with the highest <N>.
set search_glob "../runs/$run_name/rest2.job*.restart*.tcl"
set candidates [glob -nocomplain $search_glob]
if {[llength $candidates] == 0} {
    error "no restart .tcl found matching $search_glob -- has the initial run reached a checkpoint?"
}
set best_run -1
set best_file ""
foreach f $candidates {
    if {[regexp {restart(\d+)\.tcl$} $f -> n]} {
        if {$n > $best_run} { set best_run $n; set best_file $f }
    }
}
puts stderr "RESTART: sourcing $best_file (i_run=$best_run)"
source $best_file

if {[info exists env(NUM_RUNS)]} {
    set num_runs $env(NUM_RUNS)
} else {
    set num_runs [expr $i_run + $num_runs]
}
puts stderr "RESTART: extending to num_runs=$num_runs"

if { ! [catch numPes] } { source $env(NAMD_HOME)/lib/replica/REST2/rest2_remd.namd }
