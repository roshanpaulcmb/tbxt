# Params-only config for the TBXT (AF3 g177d) REST2 setup. Holds replica counts,
# temperatures, run-length parameters, the run name, and the output_root layout.
# Sourced by job0.conf for the initial run and by each restart_N.conf for
# continuations. Do not pass this file to namd3 directly -- use a jobN.conf
# launcher.

set num_replicas 4
set min_temp 310
set max_temp 425
set steps_per_run 1000
set num_runs 75000
# num_runs should be divisible by runs_per_frame * frames_per_restart
set runs_per_frame 10
set frames_per_restart 15
set namd_config_file "tbxtAf3g177d.namd"

# Run identifier. Default is tbxtAf3g177d_run1; override with the RUN_NAME env
# var (e.g. python wrapper sets a timestamp).
if {[info exists env(RUN_NAME)]} {
    set run_name $env(RUN_NAME)
} else {
    set run_name "tbxtAf3g177d_run1"
}
set output_root "../runs/$run_name/%s/rest2" ; # ../runs/$run_name/<rid>/ must exist (namd3 cwd = rest2/)
