# Launcher for the initial REST2 run (i_job = 0). Sources the params from
# initTbxtAf3g177d.conf, sets the physical temperature, then sources NAMD's
# rest2_remd.namd driver which runs the replica-exchange loop. Submit via:
#   $namd3 +replicas $num_replicas job0.conf +stdout <rundir>/%d/job0.log
# For continuations past num_runs, use a restart_N.conf launcher instead.

source initTbxtAf3g177d.conf
set TEMP $min_temp
if { ! [catch numPes] } { source $env(NAMD_HOME)/lib/replica/REST2/rest2_remd.namd }
